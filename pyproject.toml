[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-research-agent"
version = "0.4.0rc1"
description = "Evidence-first, durable multi-agent research workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.3,<4", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "langgraph>=1.2.9,<1.3", "langgraph-checkpoint-postgres>=3.1.1,<4",
  "boto3>=1.37,<2", "beautifulsoup4>=4.13,<5", "lxml>=5,<7",
  "pdfplumber>=0.11,<1", "python-multipart>=0.0.20,<1",
  "opentelemetry-sdk>=1.31,<2", "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
research = "research_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and MinIO", "live: spends API credits; explicit opt-in only"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
