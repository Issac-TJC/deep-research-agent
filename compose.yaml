name: research-agent-v1
x-app-env: &app-env
  DATABASE_URL: postgresql://research_app:research_local@postgres:5432/research
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: research_minio
  S3_SECRET_KEY: research_minio_local_secret
  S3_BUCKET: research-artifacts
  PARSER_URL: http://parser:8001
  RESEARCH_MODE: ${RESEARCH_MODE:-live}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-enabled}
  DEEPSEEK_EFFORT: ${DEEPSEEK_EFFORT:-low}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  LIVE_CAMPAIGN_USD: ${LIVE_CAMPAIGN_USD:-10}
  MODEL_INPUT_USD_PER_MILLION: ${MODEL_INPUT_USD_PER_MILLION:-0.30}
  MODEL_OUTPUT_USD_PER_MILLION: ${MODEL_OUTPUT_USD_PER_MILLION:-1.20}
  MODEL_CACHE_USD_PER_MILLION: ${MODEL_CACHE_USD_PER_MILLION:-0.006}
  SEARCH_USD_PER_CALL: ${SEARCH_USD_PER_CALL:-0.01}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90}
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: research_minio
      MINIO_ROOT_PASSWORD: research_minio_local_secret
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["objects:/data"]
  migrate:
    build: {context: ., dockerfile: infra/docker/Dockerfile}
    command: research migrate
    environment:
      <<: *app-env
      ADMIN_DATABASE_URL: postgresql://postgres:postgres_local@postgres:5432/research
    depends_on:
      postgres: {condition: service_healthy}
  parser:
    build: {context: ., dockerfile: infra/docker/Dockerfile}
    command: uvicorn research_agent.parser_service:app --host 0.0.0.0 --port 8001
    networks: [parse]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    build: {context: ., dockerfile: infra/docker/Dockerfile}
    environment: *app-env
    networks: [default, parse]
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_started}
      parser: {condition: service_started}
  worker:
    build: {context: ., dockerfile: infra/docker/Dockerfile}
    command: research worker
    environment: *app-env
    networks: [default, parse]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_started}
      parser: {condition: service_started}
  web:
    build: {context: ./apps/web}
    environment:
      RESEARCH_API_INTERNAL: http://api:8000
    ports: ["127.0.0.1:13000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  objects:
networks:
  parse:
    internal: true
