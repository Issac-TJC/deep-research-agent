name: research-agent-isolated-tests
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - test-pgdata:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: research_minio
      MINIO_ROOT_PASSWORD: research_minio_local_secret
    ports: ["127.0.0.1:29000:9000"]
    volumes: ["test-objects:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  test-pgdata:
  test-objects:
